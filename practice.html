
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(15px);
            padding: 35px;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #ddd;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 5px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
        }

        .sum {
            background: #16a34a;
        }

        .sub {
            background: #2563eb;
        }

        .multiply {
            background: #9333ea;
        }

        .divide {
            background: #ea580c;
        }

        #Result {
            color: white;
            text-align: center;
            margin-top: 25px;
            font-size: 22px;
            min-height: 28px;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <label for="num1">Number 1</label>
        <input type="number" id="num1" placeholder="Enter first number">

        <label for="num2">Number 2</label>
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="buttons">
            <button class="sum" onclick="calculate('sum')">+ Sum</button>

            <button class="sub" onclick="calculate('sub')">− Sub</button>

            <button class="multiply" onclick="calculate('multiply')">× Multiply</button>

            <button class="divide" onclick="calculate('divide')">÷ Divide</button>
        </div>

        <h2 id="Result">Result will appear here</h2>

        <p class="footer">Made with HTML, CSS & JavaScript</p>

    </div>

    <script>

        function calculate(operation) {

            let input1 = document.getElementById("num1");
            let input2 = document.getElementById("num2");
            let result = document.getElementById("Result");

            if (input1.value === "" || input2.value === "") {
                result.innerHTML = "Please enter both numbers!";
                return;
            }

            let a = Number(input1.value);
            let b = Number(input2.value);

            let answer;

            if (operation === "sum") {
                answer = a + b;
            }

            else if (operation === "sub") {
                answer = a - b;
            }

            else if (operation === "multiply") {
                answer = a * b;
            }

            else if (operation === "divide") {

                if (b === 0) {
                    result.innerHTML = "Cannot divide by zero!";
                    return;
                }

                answer = a / b;
            }

            result.innerHTML = "Result: " + answer;
        }

    </script>

</body>
</html>
